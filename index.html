<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spark Youth Club | The Spark In You</title>
  <meta name="description" content="Spark Youth Club, an ISKCON Coimbatore initiative. Real friends, real conversations, real growth. Discussion, music and dinner every Saturday.">
  <meta name="theme-color" content="#0c0a09">
  <meta property="og:title" content="Spark Youth Club | The Spark In You">
  <meta property="og:description" content="Real friends. Real conversations. Real growth. Join us every Saturday at ISKCON Coimbatore.">
  <meta property="og:type" content="website">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%230c0a09'/%3E%3Cpath d='M13 3 5 13.500h6L10 21l9-11.500h-6L13 3z' fill='%23FF6F00'/%3E%3C/svg%3E">
  <script>
    // apply the saved theme before first paint
    (function () { try { var t = localStorage.getItem('spark.theme'); if (t === 'light') document.documentElement.dataset.theme = 'light'; } catch (e) {} })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/main.css">
  <link rel="stylesheet" href="assets/css/calendar.css">
  <link rel="stylesheet" href="assets/css/gallery.css">
  <script defer src="https://cdn.jsdelivr.net/npm/lenis@1.1.13/dist/lenis.min.js"></script>
  <script>
    // On a web server the readable source modules are used. When the page is opened straight
    // from a folder (file://) browsers block modules, so a pre-built single file is used instead.
    (function () {
      var s = document.createElement('script');
      if (location.protocol === 'file:') { s.src = 'assets/js/dist/app.bundle.js'; s.defer = true; }
      else { s.type = 'module'; s.src = 'assets/js/app.js'; }
      document.head.appendChild(s);
    })();
  </script>
  <noscript><style>.loader{display:none}[data-reveal]{opacity:1!important;transform:none!important}</style></noscript>
</head>
<body class="is-locked">

  <!-- Loading screen -->
  <div class="loader" id="loader" role="status" aria-label="Loading Spark Youth Club">
    <canvas id="loaderFx"></canvas>
    <div class="loader__core">
      <div class="loader__word" aria-hidden="true"><span>S</span><span>P</span><span>A</span><span>R</span><span>K</span></div>
      <div class="loader__meta"><span>Igniting</span><span class="loader__bar"><i></i></span><span class="loader__pct">000</span></div>
    </div>
    <div class="loader__flash"></div>
  </div>

  <script>
    setTimeout(function () {
      var l = document.getElementById('loader');
      if (l && !document.querySelector('#app > *')) {
        var m = l.querySelector('.loader__meta');
        if (m) m.innerHTML = '<span style="letter-spacing:.08em;text-transform:none;max-width:32ch;line-height:1.5">The site could not start. Check your internet connection and reload the page.</span>';
      }
    }, 9000);
  </script>
  <canvas id="fx" aria-hidden="true"></canvas>
  <div class="cursor" aria-hidden="true"><div class="cursor__ring"><span></span></div><div class="cursor__dot"></div></div>
  <div class="progress" aria-hidden="true"></div>
  <div class="veil" aria-hidden="true"></div>

  <header class="nav" id="nav">
    <div class="container nav__inner">
      <a class="brand" href="#/" aria-label="Spark Youth Club, home">
        <span class="brand__mark"><i><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M13 2 3 14h9l-1 8 10-12h-9l1-8z"/></svg></i></span>
        <span><span class="brand__name">SPARK<b>.Youth Club</b></span><span class="brand__sub">An ISKCON Coimbatore initiative</span></span>
      </a>
      <nav class="nav__links" id="navLinks" aria-label="Main">
        <a href="#/" data-nav="home">Home</a>
        <a href="#/" data-scroll="about">About</a>
        <a href="#/" data-scroll="events" data-nav="events">Events</a>
        <a href="#/calendar" data-nav="calendar">Calendar</a>
        <a href="#/gallery" data-nav="gallery">Gallery</a>
        <a href="#/" data-scroll="contact">Contact</a>
      </nav>
      <div class="nav__tools">
        <button class="icon-btn" id="soundBtn" aria-label="Toggle spark sounds" aria-pressed="false"></button>
        <button class="icon-btn" id="themeBtn" aria-label="Switch between dark and light theme"></button>
        <button class="btn btn--sm nav__cta" data-register data-magnetic>Join Spark</button>
        <button class="icon-btn nav__burger" id="burger" aria-label="Menu" aria-expanded="false" aria-controls="navLinks"></button>
      </div>
    </div>
  </header>

  <main id="app"></main>

  <footer class="footer">
    <div class="container">
      <div class="footer__big" aria-hidden="true">Spark</div>
      <div class="footer__row">
        <span>© <span id="year"></span> Spark Youth Club · An ISKCON Coimbatore initiative</span>
        <nav class="footer__links" aria-label="Footer">
          <a href="#/calendar">Calendar</a>
          <a href="#/gallery">Gallery</a>
          <a href="https://www.instagram.com/sparkcbe/" target="_blank" rel="noopener">Instagram</a>
          <a href="mailto:spark@iskconcoimbatore.org">Email</a>
          <a href="assets/img/CREDITS.md">Photo credits</a>
        </nav>
      </div>
      <div class="footer__row" style="margin-top:14px">
        <span>Real friends. Real conversations. Real growth. Real you.</span>
        <a class="footer__admin" href="admin.html" id="adminLink">Admin</a>
      </div>
    </div>
  </footer>

  <noscript><p style="padding:40px;text-align:center">Spark Youth Club, ISKCON Coimbatore. Please enable JavaScript to see this site. Call +91 98765 43210 or write to spark@iskconcoimbatore.org.</p></noscript>
</body>
</html>
